<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-datetime presentation="time" [preferWheel] = "true" hourCycle="h12" [minuteValues] = "[0,5,10,15,20,25,30,35,40,45,50,55]" (ionChange) = "onSleepTimeChange($event)"></ion-datetime>
  <ion-datetime presentation="time" [preferWheel] = "true" hourCycle="h12" [minuteValues] = "[0,5,10,15,20,25,30,35,40,45,50,55]" (ionChange) = "onWakeTimeChange($event)"></ion-datetime>
  <ion-button (click) = "saveOvernightSleep()">Save sleep</ion-button>
  <ion-range [min] = "1" [max] = "7" [step] = "1" [snaps] = true (ionChange) = "onSleepinessChange($event)"></ion-range>
  <ion-button (click) = "saveSleepinessChange()">Save sleepeness</ion-button>

  <ion-header collapse="condense">
  
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>
